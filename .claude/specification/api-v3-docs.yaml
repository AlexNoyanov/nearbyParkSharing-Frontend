  "components": {
    "schemas": {
      "SpotRequest": {
        "type": "object",
        "description": "Запрос на создание/редактирование парковочного места",
        "properties": {
          "address": {
            "type": "string",
            "description": "Адрес места",
            "example": "Москва, Красная площадь, 1",
            "minLength": 1
          },
          "latitude": {
            "type": "number",
            "format": "double",
            "description": "Широта (Lat)",
            "example": 55.7558
          },
          "longitude": {
            "type": "number",
            "format": "double",
            "description": "Долгота (Lng)",
            "example": 37.6173
          },
          "vehicleType": {
            "type": "string",
            "description": "Тип транспортного средства",
            "enum": [
              "CAR",
              "SUV",
              "VAN",
              "TRUCK",
              "MOTORCYCLE"
            ],
            "example": "CAR"
          },
          "pricePerHour": {
            "type": "number",
            "description": "Цена за час (RUB)",
            "example": 199.99,
            "minimum": 0
          },
          "pricePerDay": {
            "type": "number",
            "description": "Цена за сутки (RUB)",
            "example": 999,
            "minimum": 0
          },
          "pricePerMonth": {
            "type": "number",
            "description": "Цена за месяц (RUB)",
            "example": 10000,
            "minimum": 0
          },
          "scheduleType": {
            "type": "string",
            "description": "Тип расписания (ALWAYS/CUSTOM)",
            "enum": [
              "ALWAYS",
              "CUSTOM"
            ],
            "example": "ALWAYS"
          },
          "availableFrom": {
            "type": "string",
            "description": "Время начала доступности (для CUSTOM)",
            "example": "08:00"
          },
          "availableTo": {
            "type": "string",
            "description": "Время окончания доступности (для CUSTOM)",
            "example": "22:00"
          },
          "availableDays": {
            "type": "array",
            "description": "Разрешенные дни недели (1-7, для CUSTOM)",
            "example": [1, 2, 3, 4, 5],
            "items": {
              "type": "integer",
              "format": "int32"
            }
          },
          "covered": {
            "type": "boolean",
            "description": "Наличие навеса/крыши"
          },
          "hasSecurity": {
            "type": "boolean",
            "description": "Наличие охраны"
          },
          "hasEvCharging": {
            "type": "boolean",
            "description": "Наличие зарядки для электромобилей"
          },
          "openSpace": {
            "type": "boolean",
            "description": "Открытая площадка (не гараж)"
          },
          "inYard": {
            "type": "boolean",
            "description": "Находится во дворе"
          },
          "privateTerritory": {
            "type": "boolean",
            "description": "Закрытая/частная территория"
          },
          "hasCctv": {
            "type": "boolean",
            "description": "Наличие видеонаблюдения"
          },
          "description": {
            "type": "string",
            "description": "Общее описание места"
          },
          "accessGuide": {
            "type": "string",
            "description": "Инструкция по доступу (как заехать/пройти)",
            "example": "Код от шлагбаума 1234"
          },
          "photos": {
            "type": "array",
            "description": "Список URL фотографий (полученных из /api/v1/media/upload)",
            "items": {
              "type": "string"
            }
          },
          "hourlyEnabled": {
            "type": "boolean",
            "description": "Включена ли почасовая аренда (если null, вычисляется по цене)"
          },
          "dailyEnabled": {
            "type": "boolean",
            "description": "Включена ли посуточная аренда (если null, вычисляется по цене)"
          },
          "monthlyEnabled": {
            "type": "boolean",
            "description": "Включена ли помесячная аренда (если null, вычисляется по цене)"
          },
          "availableDateFrom": {
            "type": "string",
            "format": "date",
            "description": "Дата начала календарной доступности (YYYY-MM-DD)",
            "example": "2026-01-15"
          },
          "availableDateTo": {
            "type": "string",
            "format": "date",
            "description": "Дата окончания календарной доступности (YYYY-MM-DD)",
            "example": "2026-06-30"
          }
        },
        "required": [
          "address",
          "latitude",
          "longitude",
          "scheduleType",
          "vehicleType"
        ]
      },
      "SpotResponse": {
        "type": "object",
        "description": "Полная информация о парковочном месте",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "description": "ID места"
          },
          "ownerId": {
            "type": "string",
            "format": "uuid",
            "description": "ID владельца"
          },
          "address": {
            "type": "string",
            "description": "Адрес"
          },
          "latitude": {
            "type": "number",
            "format": "double",
            "description": "Широта"
          },
          "longitude": {
            "type": "number",
            "format": "double",
            "description": "Долгота"
          },
          "vehicleType": {
            "type": "string",
            "description": "Тип транспорта",
            "enum": [
              "CAR",
              "SUV",
              "VAN",
              "TRUCK",
              "MOTORCYCLE"
            ]
          },
          "pricePerHour": {
            "type": "number",
            "description": "Цена за час"
          },
          "pricePerDay": {
            "type": "number",
            "description": "Цена за сутки"
          },
          "pricePerMonth": {
            "type": "number",
            "description": "Цена за месяц"
          },
          "hourlyEnabled": {
            "type": "boolean",
            "description": "Почасовая аренда включена"
          },
          "dailyEnabled": {
            "type": "boolean",
            "description": "Посуточная аренда включена"
          },
          "monthlyEnabled": {
            "type": "boolean",
            "description": "Помесячная аренда включена"
          },
          "availableDateFrom": {
            "type": "string",
            "format": "date",
            "description": "Дата начала календарной доступности"
          },
          "availableDateTo": {
            "type": "string",
            "format": "date",
            "description": "Дата окончания календарной доступности"
          },
          "scheduleType": {
            "type": "string",
            "description": "Тип расписания (ALWAYS/CUSTOM)",
            "enum": [
              "ALWAYS",
              "CUSTOM"
            ]
          },
          "availableFrom": {
            "type": "string",
            "description": "Время начала (для CUSTOM)"
          },
          "availableTo": {
            "type": "string",
            "description": "Время окончания (для CUSTOM)"
          },
          "availableDays": {
            "type": "array",
            "description": "Разрешенные дни недели (для CUSTOM)",
            "items": {
              "type": "integer",
              "format": "int32"
            }
          },
          "covered": {
            "type": "boolean",
            "description": "Наличие навеса"
          },
          "hasSecurity": {
            "type": "boolean",
            "description": "Наличие охраны"
          },
          "hasEvCharging": {
            "type": "boolean",
            "description": "Наличие зарядки"
          },
          "openSpace": {
            "type": "boolean",
            "description": "Открытая площадка"
          },
          "inYard": {
            "type": "boolean",
            "description": "Во дворе"
          },
          "privateTerritory": {
            "type": "boolean",
            "description": "Частная территория"
          },
          "hasCctv": {
            "type": "boolean",
            "description": "Видеонаблюдение"
          },
          "description": {
            "type": "string",
            "description": "Описание"
          },
          "photos": {
            "type": "array",
            "description": "Список фото",
            "items": {
              "type": "string"
            }
          },
          "active": {
            "type": "boolean",
            "description": "Активно ли объявление (снято ли с публикации)"
          }
        }
      },
      "CarRequest": {
        "type": "object",
        "properties": {
          "licensePlate": {
            "type": "string",
            "description": "Госномер РФ (можно с пробелами)",
            "example": "А 777 АА 777",
            "minLength": 1,
            "pattern": "^[А-Яа-яA-Z0-9\\s]+$"
          },
          "brand": {
            "type": "string",
            "description": "Марка авто",
            "example": "Toyota",
            "minLength": 1
          },
          "model": {
            "type": "string",
            "description": "Модель авто",
            "example": "Camry"
          },
          "color": {
            "type": "string",
            "description": "Цвет авто",
            "example": "Черный"
          }
        },
        "required": [
          "brand",
          "licensePlate"
        ]
      },
      "CarResponse": {
        "type": "object",
        "description": "Информация об автомобиле",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "description": "ID автомобиля"
          },
          "licensePlate": {
            "type": "string",
            "description": "Госномер (нормализованный)",
            "example": "А777АА777"
          },
          "brand": {
            "type": "string",
            "description": "Марка",
            "example": "Toyota"
          },
          "model": {
            "type": "string",
            "description": "Модель",
            "example": "Camry"
          },
          "color": {
            "type": "string",
            "description": "Цвет",
            "example": "Черный"
          }
        }
      },
      "ArchiveSpotRequest": {
        "type": "object",
        "description": "Параметры снятия места с публикации",
        "properties": {
          "cancelBlockingBookings": {
            "type": "boolean",
            "description": "Если true — отменить активные/предстоящие бронирования и снять с публикации. Если false — снять с публикации можно только при отсутствии таких бронирований.",
            "example": false
          },
          "cancelReason": {
            "type": "string",
            "description": "Причина отмены (опционально). Используется, если cancelBlockingBookings=true.",
            "example": "Место временно недоступно"
          }
        }
      },
      "CreateBookingRequest": {
        "type": "object",
        "description": "Создание заявки на бронирование.\n\nПоля зависят от rentType:\n- HOURLY: date + timeFrom + timeTo\n- DAILY/MONTHLY: dateFrom + dateTo (обе даты включительно по смыслу UI)\ncarId обязателен (показывается в деталях заявки).\n",
        "properties": {
          "spotId": {
            "type": "string",
            "format": "uuid",
            "description": "ID места."
          },
          "carId": {
            "type": "string",
            "format": "uuid",
            "description": "ID автомобиля арендатора."
          },
          "rentType": {
            "type": "string",
            "description": "Тип аренды: HOURLY / DAILY / MONTHLY.",
            "enum": [
              "HOURLY",
              "DAILY",
              "MONTHLY"
            ]
          },
          "date": {
            "type": "string",
            "format": "date",
            "description": "Дата для HOURLY (YYYY-MM-DD).",
            "example": "2026-01-15"
          },
          "timeFrom": {
            "type": "string",
            "description": "Время начала для HOURLY (HH:mm).",
            "example": "10:00"
          },
          "timeTo": {
            "type": "string",
            "description": "Время окончания для HOURLY (HH:mm).",
            "example": "12:00"
          },
          "dateFrom": {
            "type": "string",
            "format": "date",
            "description": "Дата начала для DAILY/MONTHLY (YYYY-MM-DD).",
            "example": "2026-01-15"
          },
          "dateTo": {
            "type": "string",
            "format": "date",
            "description": "Дата окончания для DAILY/MONTHLY (YYYY-MM-DD, включительно).",
            "example": "2026-01-20"
          },
          "clientTotalAmount": {
            "type": "number",
            "description": "Сумма, рассчитанная фронтом, для отображения (RUB).",
            "example": 160
          }
        },
        "required": [
          "carId",
          "rentType",
          "spotId"
        ]
      },
      "BookingDetailsResponse": {
        "type": "object",
        "description": "Детальная модель бронирования (для экрана заявки/чата).",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "description": "ID бронирования."
          },
          "spot": {
            "$ref": "#/components/schemas/SpotShortResponse",
            "description": "Место, которое бронируют."
          },
          "owner": {
            "$ref": "#/components/schemas/PersonShortResponse",
            "description": "Владелец места (арендодатель)."
          },
          "renter": {
            "$ref": "#/components/schemas/PersonShortResponse",
            "description": "Арендатор (кто создал заявку)."
          },
          "car": {
            "$ref": "#/components/schemas/CarShortResponse",
            "description": "Выбранный автомобиль арендатора."
          },
          "rentType": {
            "type": "string",
            "description": "Тип аренды: HOURLY / DAILY / MONTHLY.",
            "enum": [
              "HOURLY",
              "DAILY",
              "MONTHLY"
            ]
          },
          "status": {
            "type": "string",
            "description": "Статус (под UI).",
            "enum": [
              "WAITING_CONFIRMATION",
              "WAITING_START",
              "ACTIVE",
              "CANCELED",
              "FINISHED"
            ]
          },
          "startAt": {
            "type": "string",
            "format": "date-time",
            "description": "Начало интервала аренды (нормализовано сервером).\nФормат ISO-8601 с offset (например ...Z).\n",
            "example": "2026-01-15T10:00:00Z"
          },
          "endAt": {
            "type": "string",
            "format": "date-time",
            "description": "Конец интервала аренды, end-exclusive.\nДля посуточной (dateFrom..dateTo включительно) endAt будет dateTo+1 в 00:00.\n",
            "example": "2026-01-15T12:00:00Z"
          },
          "totalAmount": {
            "type": "number",
            "description": "Итоговая стоимость.\nНа MVP можно хранить/возвращать clientTotalAmount, чтобы в чате показывать сумму как на макете.\n",
            "example": 160
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "description": "Когда создана заявка.",
            "example": "2026-01-13T12:30:00Z"
          }
        }
      },
      "CarShortResponse": {
        "type": "object",
        "description": "Короткая информация об автомобиле, выбранном для бронирования.",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "description": "ID автомобиля."
          },
          "licensePlate": {
            "type": "string",
            "description": "Госномер (нормализованный, без пробелов).",
            "example": "A123BB77"
          },
          "brand": {
            "type": "string",
            "description": "Марка.",
            "example": "Toyota"
          },
          "model": {
