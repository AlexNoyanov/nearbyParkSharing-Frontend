{
  "openapi": "3.1.0",
  "info": {
    "title": "ParkSharing API",
    "description": "API для аренды парковок и авторизации через Telegram + SMS",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "/parkshare"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Чаты",
      "description": "Управление чатами и сообщениями между участниками бронирования"
    },
    {
      "name": "Пользователи",
      "description": "Управление данными профиля пользователя"
    },
    {
      "name": "Spots",
      "description": "Управление парковочными местами (Сдать место)"
    },
    {
      "name": "Автомобили",
      "description": "Управление списком автомобилей пользователя (гараж)"
    },
    {
      "name": "Авторизация",
      "description": "Флоу авторизации через Telegram Mini Apps и верификацию номера телефона (Call Check)"
    },
    {
      "name": "Bookings",
      "description": "Управление жизненным циклом бронирования: создание, подтверждение, завершение"
    },
    {
      "name": "Медиа",
      "description": "Загрузка и управление файлами (S3)"
    }
  ],
  "paths": {
    "/api/v1/spots/{id}": {
      "get": {
        "tags": [
          "Spots"
        ],
        "summary": "Получить детали места по ID (публичный)",
        "description": "Используется после выбора места на карте. Возвращает детали только для активных мест.",
        "operationId": "getById",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/SpotDetailsPublicResponse"
                }
              }
            }
          }
        }
      },
      "put": {
        "tags": [
          "Spots"
        ],
        "summary": "Редактировать объявление",
        "description": "Полное обновление полей. Если изменить список фото, лишние удалятся из S3.",
        "operationId": "update",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SpotRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/SpotResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/cars/{id}": {
      "put": {
        "tags": [
          "Автомобили"
        ],
        "summary": "Редактировать автомобиль",
        "description": "Позволяет изменить данные (номер, марка, модель, цвет) существующего автомобиля. Можно редактировать только свои машины.",
        "operationId": "updateCar",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CarRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Успешное обновление",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CarResponse"
                }
              }
            }
          },
          "404": {
            "description": "Машина не найдена или принадлежит другому пользователю",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CarResponse"
                }
              }
            }
          }
        }
      },
      "delete": {
        "tags": [
          "Автомобили"
        ],
        "summary": "Удалить автомобиль",
        "description": "Безвозвратное удаление автомобиля из профиля пользователя. Можно удалить только свою машину.",
        "operationId": "deleteCar",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Машина удалена"
          }
        }
      }
    },
    "/api/v1/spots": {
      "post": {
        "tags": [
          "Spots"
        ],
        "summary": "Создать объявление",
        "description": "Принимает данные места и список URL фото (загруженных ранее)",
        "operationId": "create",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SpotRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Created",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/SpotResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/spots/{id}/archive": {
      "post": {
        "tags": [
          "Spots"
        ],
        "summary": "Снять место с публикации (архивировать)",
        "description": "Переводит место в архив (active=false). Доступно только владельцу места.\n\nТело запроса опционально:\n- Если тело не передано или cancelBlockingBookings=false — место снимается с публикации, бронирования не изменяются.\n- Если cancelBlockingBookings=true — отменяются только предстоящие бронирования (WAITING_CONFIRMATION, WAITING_START).\n  Если при этом есть активное бронирование (ACTIVE), возвращается 409 (нельзя отменить активное).\n",
        "operationId": "archive",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ArchiveSpotRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Место снято с публикации"
          },
          "401": {
            "description": "Неавторизован"
          },
          "403": {
            "description": "Нет прав (не владелец)"
          },
          "404": {
            "description": "Место не найдено"
          },
          "409": {
            "description": "Конфликт: есть активное бронирование при cancelBlockingBookings=true"
          }
        }
      }
    },
    "/api/v1/spots/{id}/activate": {
      "post": {
        "tags": [
          "Spots"
        ],
        "summary": "Вернуть из архива",
        "description": "Сделать объявление снова активным",
        "operationId": "activate",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK"
          }
        }
      }
    },
    "/api/v1/media/upload": {
      "post": {
        "tags": [
          "Медиа"
        ],
        "summary": "Загрузить изображение",
        "description": "Загружает файл в S3 и возвращает его публичный URL. Этот URL необходимо сохранить и передать в списке фото при создании/редактировании объявления (Spot).",
        "operationId": "upload",
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "Файл изображения (jpg, png)"
                  }
                },
                "required": [
                  "file"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Файл загружен",
            "content": {
              "*/*": {
                "schema": {
                  "type": "string",
                  "example": {
                    "url": "https://s3.../img.jpg"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/cars": {
      "get": {
        "tags": [
          "Автомобили"
        ],
        "summary": "Получить список моих авто",
        "description": "Возвращает все автомобили, добавленные текущим пользователем.",
        "operationId": "getMyCars",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/CarResponse"
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "tags": [
          "Автомобили"
        ],
        "summary": "Добавить новый автомобиль",
        "description": "Регистрирует новый автомобиль в системе для текущего пользователя.",
        "operationId": "addCar",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CarRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Машина успешно добавлена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CarResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/bookings": {
      "post": {
        "tags": [
          "Bookings"
        ],
        "summary": "Создать запрос на бронирование",
        "description": "Создаёт новую заявку на бронирование в статусе WAITING_CONFIRMATION. Также автоматически создается заблокированный чат.",
        "operationId": "create_1",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateBookingRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Бронирование создано",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          },
          "400": {
            "description": "Некорректные входные данные",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          },
          "409": {
            "description": "Выбранный интервал времени уже занят",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/bookings/{id}/start": {
      "post": {
        "tags": [
          "Bookings"
        ],
        "summary": "Начать парковку (арендатор)",
        "description": "Арендатор подтверждает начало парковки: WAITING_START -\u003E ACTIVE.",
        "operationId": "start",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "ID бронирования",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Парковка начата",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/bookings/{id}/finish": {
      "post": {
        "tags": [
          "Bookings"
        ],
        "summary": "Завершить бронирование",
        "description": "Переводит бронирование в статус FINISHED и закрывает чат. Доступно обоим участникам.",
        "operationId": "finish",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "ID бронирования",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Бронирование завершено",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/bookings/{id}/confirm": {
      "post": {
        "tags": [
          "Bookings"
        ],
        "summary": "Подтвердить бронирование (владелец)",
        "description": "Переводит бронирование в статус WAITING_START и разблокирует чат.",
        "operationId": "confirm",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "ID бронирования",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Бронирование подтверждено",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          },
          "400": {
            "description": "Неверное состояние бронирования",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          },
          "404": {
            "description": "Бронирование не найдено",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/bookings/{id}/cancel": {
      "post": {
        "tags": [
          "Bookings"
        ],
        "summary": "Отменить бронирование",
        "description": "Отменяет бронирование и закрывает чат. Доступно обоим участникам.",
        "operationId": "cancel",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "ID бронирования",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CancelBookingRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Бронирование отменено",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookingDetailsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "tags": [
          "Авторизация"
        ],
        "summary": "Шаг 1: Вход / Проверка сессии",
        "description": "Вызывается при запуске приложения. Проверяет подпись Telegram initData. Если пользователь новый или не подтвердил телефон, возвращает статус NEED_PHONE.",
        "operationId": "login",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AuthLoginRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Успешная проверка",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthLoginResponse"
                }
              }
            }
          },
          "401": {
            "description": "Невалидная initData (подпись не совпала)"
          }
        }
      }
    },
    "/api/v1/auth/call-check/status": {
      "post": {
        "tags": [
          "Авторизация"
        ],
        "summary": "Шаг 3: Проверка статуса звонка (Polling)",
        "description": "Опрашивать этот эндпоинт каждые 3-5 секунд, пока пользователь звонит. Когда звонок будет зафиксирован, вернет статус OK и JWT токен.",
        "operationId": "checkStatus",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PhoneStatusRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Статус проверки",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthLoginResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/call-check/init": {
      "post": {
        "tags": [
          "Авторизация"
        ],
        "summary": "Шаг 2: Инициализация проверки телефона",
        "description": "Используется, если на шаге 1 получен статус NEED_PHONE. Возвращает номер (callToNumber), на который пользователь должен совершить звонок.",
        "operationId": "initCall",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PhoneRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Номер для звонка получен",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CallCheckResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/users/me": {
      "get": {
        "tags": [
          "Пользователи"
        ],
        "summary": "Получить мой профиль",
        "description": "Возвращает информацию о текущем авторизованном пользователе (на основе JWT).",
        "operationId": "me",
        "responses": {
          "200": {
            "description": "Профиль успешно получен",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UserResponse"
                }
              }
            }
          },
          "401": {
            "description": "Неавторизован"
          }
        }
      }
    },
    "/api/v1/spots/{id}/archive/preview": {
      "get": {
        "tags": [
          "Spots"
        ],
        "summary": "Предпросмотр снятия с публикации",
        "description": "Возвращает список активных и предстоящих бронирований, которые мешают архивации. Доступно только владельцу.",
        "operationId": "previewArchive",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/SpotBlockingBookingsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/spots/search": {
      "get": {
        "tags": [
          "Spots"
        ],
        "summary": "Поиск парковочных мест (карта + доступность)",
        "description": "Ищет места, подходящие под тип аренды и свободные в указанном интервале.\nГео-фильтры (bbox или радиус) необязательны.\n\nОбязательные поля по типам аренды:\n- HOURLY: date, timeFrom, timeTo\n- DAILY/MONTHLY: dateFrom, dateTo\n\nПравила доступности:\n- Место должно быть активно.\n- Тип аренды должен быть включен для этого места.\n- Интервал должен попадать в календарь доступности владельца.\n- Исключаются места с пересекающимися бронированиями (статусы WAITING_CONFIRMATION, WAITING_START, ACTIVE).\n",
        "operationId": "search",
        "parameters": [
          {
            "name": "req",
            "in": "query",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/SpotSearchRequest"
            }
          },
          {
            "name": "rentType",
            "in": "query",
            "description": "Rent type: HOURLY, DAILY, MONTHLY. Example: HOURLY",
            "required": true
          },
          {
            "name": "date",
            "in": "query",
            "description": "HOURLY only. Date in YYYY-MM-DD. Example: 2026-01-15"
          },
          {
            "name": "timeFrom",
            "in": "query",
            "description": "HOURLY only. Start time in HH:mm. Example: 10:00"
          },
          {
            "name": "timeTo",
            "in": "query",
            "description": "HOURLY only. End time in HH:mm. Example: 12:00"
          },
          {
            "name": "dateFrom",
            "in": "query",
            "description": "DAILY/MONTHLY only. Start date in YYYY-MM-DD. Example: 2026-01-15"
          },
          {
            "name": "dateTo",
            "in": "query",
            "description": "DAILY/MONTHLY only. End date in YYYY-MM-DD. Example: 2026-01-20"
          },
          {
            "name": "minLat",
            "in": "query",
            "description": "Map bbox. Minimum latitude. Example: 55.70"
          },
          {
            "name": "minLng",
            "in": "query",
